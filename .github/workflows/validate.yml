name: Validate Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate plugin structure
        run: ./scripts/ci/validate-plugin.sh

      - name: Check skill SDK import consistency
        run: ./scripts/ci/check-skill-consistency.sh

  type-check-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scripts/ci/snippets/package.json
      - name: Type-check skill code blocks
        run: ./scripts/ci/check-snippets.sh
      - name: Run skip-import gate self-tests
        run: node --test scripts/ci/tests/check-skip-imports.test.mjs

  check-compat-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run compat matrix check
        run: bash scripts/ci/check-compat-matrix.sh
      - name: Run check script self-tests
        run: node --test scripts/ci/tests/check-compat-matrix.test.mjs
      - name: Run freshness self-tests
        run: node --test scripts/freshness/tests/*.test.mjs

  check-move-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check Move framework symbols in fenced blocks
        run: bash scripts/ci/check-move-symbols.sh
      - name: Run Move symbol gate self-tests
        run: node --test scripts/ci/tests/check-move-symbols.test.mjs

  check-move-build:
    runs-on: ubuntu-latest
    # A cache miss pulls a ~1 GB tarball; the runner's default cap is six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The compiler version is not a workflow constant: it is read from the vendored symbol
      # index, so this job and the symbol gate can never drift onto different framework
      # revisions without one of them failing loudly.
      - name: Read the pinned sui version
        id: pin
        run: echo "tag=$(node -p "require('./scripts/ci/move-symbols/index.json').tag")" >> "$GITHUB_OUTPUT"
      - name: Cache the sui CLI
        id: sui-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/sui-bin
          key: sui-cli-${{ steps.pin.outputs.tag }}-ubuntu-x86_64
      # The release tarball carries every binary in the repo (~1 GB) and we need exactly one,
      # so only `./sui` is extracted and only that is cached.
      - name: Install the sui CLI
        if: steps.sui-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TAG='${{ steps.pin.outputs.tag }}'
          mkdir -p ~/.local/share/sui-bin
          curl -fsSL -o /tmp/sui.tgz \
            "https://github.com/MystenLabs/sui/releases/download/$TAG/sui-$TAG-ubuntu-x86_64.tgz"
          tar -xzf /tmp/sui.tgz -C ~/.local/share/sui-bin ./sui
          chmod +x ~/.local/share/sui-bin/sui
      - name: Put the pinned sui on PATH
        run: echo "$HOME/.local/share/sui-bin" >> "$GITHUB_PATH"
      - name: Cache the Move framework sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/sui-dev-agents
          key: move-framework-${{ steps.pin.outputs.tag }}
      - name: Compile fenced ```move module blocks
        run: bash scripts/ci/check-move-build.sh
      - name: Run Move build gate self-tests
        run: node --test scripts/ci/tests/check-move-build.test.mjs
